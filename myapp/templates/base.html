<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}QuizMaster{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    * {
      transition: all 0.3s ease-in-out;
    }

    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      min-height: 100vh;
    }

    /* ===== LIGHT MODE ===== */
    body.light-mode {
      color: #172033;
      background: radial-gradient(circle at 10% 10%, #dbeafe 0, transparent 32%), radial-gradient(circle at 90% 15%, #e9d5ff 0, transparent 30%), #f8fafc;
      background-attachment: fixed;
    }

    /* ===== DARK MODE ===== */
    body.dark-mode {
      color: #f0f0f0;
      background: radial-gradient(circle at top left, #0f2027, #203a43 40%, #2c5364 100%);
      background-attachment: fixed;
    }

    /* ===== NAVBAR ===== */
    .navbar-custom {
      background: rgba(15, 23, 42, 0.92);
      padding: 14px clamp(18px, 4vw, 48px);
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.16);
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
    }

    .navbar-custom .nav-link, .navbar-custom .btn-logout {
      color: #fff !important;
      font-weight: 600;
      margin-left: 15px;
    }

    .navbar-custom .nav-link:hover, .navbar-custom .btn-logout:hover {
      color: #b9f2ff !important;
      transform: scale(1.03);
    }

    /* ===== CONTENT CONTAINER ===== */
    .content {
      padding: clamp(24px, 4vw, 48px);
      max-width: 1120px;
      margin: clamp(24px, 5vw, 56px) auto;
      background: linear-gradient(135deg, #e3f2fd, #fce4ec); /* soft blue-pink blend */ /* ✅ Changed from white to a soft bluish-gray */
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 24px;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
      backdrop-filter: blur(14px);
      animation: fadeIn 0.6s ease-in-out;
    }


    body.dark-mode .content {
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(148, 163, 184, 0.18);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.34);
    }

    body.dark-mode .text-dark,
    body.dark-mode .text-secondary {
      color: #dbeafe !important;
    }

    body.dark-mode .form-control,
    body.dark-mode .form-select {
      color: #f8fafc;
      background-color: #1e293b;
      border-color: #475569;
    }

    body.dark-mode .form-control:focus,
    body.dark-mode .form-select:focus {
      border-color: #7dd3fc;
      box-shadow: 0 0 0 .25rem rgba(56, 189, 248, .18);
    }

    /* ===== USER INFO / AVATAR ===== */
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      margin-right: 8px;
      border: 2px solid white;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    }

    .user-info {
      display: flex;
      align-items: center;
      color: white;
      font-weight: 600;
    }

    /* ===== BUTTONS ===== */
    .btn-custom {
      padding: 10px 22px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(135deg, #007991, #78ffd6);
      color: white;
      font-weight: 600;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .btn-custom:hover {
      background: linear-gradient(135deg, #00687a, #58e6c5);
      transform: translateY(-2px);
    }

    /* ===== ALERT / MESSAGE BOX ===== */
    .msg {
      background: #eff6ff;
      color: #1e3a8a;
      padding: 14px 18px;
      margin-bottom: 16px;
      border-radius: 10px;
      border-left: 5px solid #007bff;
    }

    body.dark-mode .msg {
      background: rgba(255, 255, 255, 0.1);
      color: #dbe9ff;
      border-left: 5px solid #4fd3c4;
    }

    @media (max-width: 576px) {
      .content { margin: 18px 12px; }
      .navbar-custom { padding: 12px 16px; }
      .user-info { max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    }

    /* ===== FADE ANIMATION ===== */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body class="{% if user.is_authenticated %}{{ user.profile.theme }}-mode{% else %}light-mode{% endif %}">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container-fluid">
      <a class="navbar-brand text-white fw-bold" href="{% url 'dashboard' %}">
        <i class="bi bi-house-door-fill me-2"></i>Dashboard
      </a>

      <div class="d-flex align-items-center">
        {% if user.is_authenticated %}
          <span class="user-info me-3">
            {% if user.profile.avatar %}
              <img src="{{ user.profile.avatar.url }}" alt="Avatar" class="avatar">
            {% endif %}
            Hi, {{ user.username }}
          </span>

          <form method="post" action="{% url 'logout' %}" class="d-inline" id="logoutForm">
            {% csrf_token %}
            <button type="submit" class="btn btn-sm btn-logout btn-outline-light rounded-pill">
              <i class="bi bi-box-arrow-right me-1"></i> Logout
            </button>
          </form>

          <script>
            document.getElementById('logoutForm').addEventListener('submit', function(event) {
              event.preventDefault();
              if (confirm("Are you sure you want to logout?")) this.submit();
            });
          </script>
        {% else %}
          <a class="nav-link" href="{% url 'login' %}"><i class="bi bi-box-arrow-in-right me-1"></i> Login</a>
          <a class="nav-link" href="{% url 'register' %}"><i class="bi bi-person-plus-fill me-1"></i> Register</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <!-- Page content -->
  <div class="content">
    {% if messages %}
      {% for message in messages %}
        <div class="msg">{{ message }}</div>
      {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
