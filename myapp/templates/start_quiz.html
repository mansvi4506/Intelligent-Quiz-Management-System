{% extends "base.html" %}
{% block content %}
<div class="quiz-wrapper d-flex justify-content-center align-items-start py-5">
  <div class="quiz-container shadow-lg p-4 rounded-4">
    <h2 class="text-center fw-bold mb-4 text-primary">🧠 Take Your Quiz</h2>

    <!-- Timer -->
    <div class="text-center mb-4">
      <h5 class="fw-semibold text-dark">⏳ Time Left: <span id="timer">02:00</span></h5>
    </div>

    <form id="quizForm" method="post" action="{% url 'submit_quiz' %}">
      {% csrf_token %}
      <div id="questionsContainer">
        {% for question in questions %}
        <div class="question-card p-4 mb-4 rounded-3 shadow-sm" role="radiogroup" aria-labelledby="question-{{ question.id }}">
          <h5 id="question-{{ question.id }}" class="fw-bold mb-3 text-primary">
            Q{{ forloop.counter }}. {{ question.question }}
          </h5>

          <label class="form-check option-choice mb-2" for="q{{ question.id }}_1">
            <input type="radio" id="q{{ question.id }}_1" name="q{{ question.id }}" value="{{ question.option1 }}" class="form-check-input option-input" required>
            <span class="form-check-label option-text">{{ question.option1 }}</span>
          </label>

          <label class="form-check option-choice mb-2" for="q{{ question.id }}_2">
            <input type="radio" id="q{{ question.id }}_2" name="q{{ question.id }}" value="{{ question.option2 }}" class="form-check-input option-input">
            <span class="form-check-label option-text">{{ question.option2 }}</span>
          </label>

          <label class="form-check option-choice mb-2" for="q{{ question.id }}_3">
            <input type="radio" id="q{{ question.id }}_3" name="q{{ question.id }}" value="{{ question.option3 }}" class="form-check-input option-input">
            <span class="form-check-label option-text">{{ question.option3 }}</span>
          </label>

          <label class="form-check option-choice mb-2" for="q{{ question.id }}_4">
            <input type="radio" id="q{{ question.id }}_4" name="q{{ question.id }}" value="{{ question.option4 }}" class="form-check-input option-input">
            <span class="form-check-label option-text">{{ question.option4 }}</span>
          </label>
        </div>
        {% endfor %}
      </div>

      <div class="text-center mt-4">
        <button type="submit" class="btn btn-success px-5 py-2 rounded-pill shadow-lg">
          🚀 Submit Quiz
        </button>
      </div>
    </form>
  </div>
</div>

<!-- Timer Script -->
<script>
let totalSeconds = 120; // 2 minutes
const timerElement = document.getElementById("timer");

function updateTimer() {
  const minutes = Math.floor(totalSeconds / 60);
  const seconds = totalSeconds % 60;
  timerElement.textContent = `${minutes.toString().padStart(2, '0')}:${seconds
    .toString()
    .padStart(2, '0')}`;

  if (totalSeconds <= 0) {
    clearInterval(timerInterval);
    alert("⏰ Time is up! Submitting your quiz automatically.");
    document.getElementById("quizForm").submit();
  }
  totalSeconds--;
}
const timerInterval = setInterval(updateTimer, 1000);

// Keep the full answer row visibly selected, including after keyboard navigation.
document.querySelectorAll(".option-input").forEach((input) => {
  input.addEventListener("change", () => {
    document.querySelectorAll(`input[name="${input.name}"]`).forEach((option) => {
      option.closest(".option-choice").classList.toggle("is-selected", option.checked);
    });
  });
});
</script>

<!-- Styles -->
<style>
/* Background — professional gradient with blue, purple, and green accents for eye-catching appeal */
.quiz-wrapper {
  background: linear-gradient(135deg, #e3f2fd 0%, #f3e5f5 50%, #e8f5e8 100%);
  min-height: 100vh;
}

/* Container — subtle semi-transparent with a soft border for professionalism */
.quiz-container {
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(10px);
  max-width: 850px;
  width: 100%;
  border: 1px solid rgba(103, 58, 183, 0.1); /* Light purple tint */
  border-radius: 16px;
}

/* Question card — light background with colorful left border and hover effects */
.question-card {
  background: linear-gradient(to right, #f8f9ff 0%, #fffdf8 100%); /* Subtle blue-to-yellow gradient */
  border-left: 5px solid #1976d2; /* Primary blue */
  transition: all 0.3s ease;
}
.question-card:nth-child(even) {
  border-left-color: #7b1fa2; /* Alternate with purple for visual interest */
}
.question-card:nth-child(3n) {
  border-left-color: #388e3c; /* Green for every third card */
}
.question-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 20px rgba(25, 118, 210, 0.2); /* Blue shadow on hover */
}

/* Option styling — white base with colorful borders and enhanced checked state */
.form-check {
  background: #ffffff;
  border: 1px solid #d6e0f0; /* Light blue */
  border-radius: 8px;
  padding: 12px 16px;
  transition: all 0.2s ease;
  margin-bottom: 12px; /* Slightly more spacing */
}

/* A large label makes the complete row a comfortable click/tap target. */
.option-choice {
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 58px;
}
.option-choice .option-input {
  flex: 0 0 auto;
  width: 1.25rem;
  height: 1.25rem;
  margin: 0;
  cursor: pointer;
}
.option-choice .option-text {
  flex: 1;
  cursor: pointer;
  line-height: 1.4;
}
.option-choice.is-selected,
.option-choice:has(.option-input:checked) {
  background: linear-gradient(90deg, #e0f2fe, #ecfdf5);
  border-color: #0ea5e9;
  box-shadow: 0 5px 14px rgba(14, 165, 233, 0.16);
}
.option-choice.is-selected .option-text,
.option-choice:has(.option-input:checked) .option-text {
  color: #0c4a6e;
  font-weight: 700;
}
.option-choice:focus-within {
  outline: 3px solid rgba(14, 165, 233, 0.35);
  outline-offset: 2px;
}
.form-check:hover {
  background: linear-gradient(90deg, #f1f7ff, #fdf2f8); /* Blue-to-pink hover gradient */
  border-color: #7b1fa2; /* Purple border on hover */
  transform: translateX(4px); /* Subtle slide for eye-catch */
}
.form-check-input:checked + .form-check-label {
  color: #0d47a1;
  font-weight: 600;
}
.form-check-input:checked {
  accent-color: #388e3c; /* Green accent for checked radio */
}

/* Submit button — vibrant green gradient with glow effect */
.btn-success {
  background: linear-gradient(90deg, #4caf50, #2e7d32, #388e3c);
  border: none;
  font-weight: 600;
  color: white;
  transition: all 0.3s ease;
  box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
}
.btn-success:hover {
  transform: scale(1.05);
  background: linear-gradient(90deg, #388e3c, #2e7d32, #4caf50);
  box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4); /* Enhanced glow */
}

/* Timer text — bold red with subtle animation for urgency */
#timer {
  color: #d32f2f;
  font-weight: 700;
  animation: pulse 1s infinite; /* Eye-catching pulse */
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

/* Additional eye-catching touches */
h2 {
  background: linear-gradient(90deg, #1976d2, #7b1fa2); /* Blue-to-purple gradient text */
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.form-check-label {
  color: #333;
  transition: color 0.2s ease;
}
</style>
{% endblock %}
