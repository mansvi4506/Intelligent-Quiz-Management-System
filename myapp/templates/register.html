<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register</title>
  <style>
    body {
      background: linear-gradient(135deg, #ffecd2, #fcb69f);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
    }
    .card {
      background: white;
      padding: 30px 40px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      width: 350px;
      text-align: center;
      transition: transform 0.3s;
    }
    .card:hover { transform: translateY(-5px); }
    h2 { margin-bottom: 20px; color: #333; font-size: 24px; }
    form { text-align: left; }
    input {
      width: 100%; padding: 10px; margin: 8px 0;
      border-radius: 8px; border: 1px solid #ccc;
      transition: border 0.3s;
    }
    input:focus { border-color: #ff9966; outline: none; }
    button {
      background: #fcb69f; border: none; padding: 10px 15px;
      border-radius: 8px; width: 100%; cursor: pointer;
      transition: 0.3s; margin-top: 10px; font-weight: bold;
    }
    button:hover { background: #ff9966; color: white; }
    p { margin-top: 15px; text-align: center; font-size: 14px; }
    a { text-decoration: none; color: #ff9966; font-weight: bold; }
    .messages { color: red; margin-bottom: 10px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Create Account ✨</h2>

    <!-- Messages -->
    {% if messages %}
      <div class="messages">
        {% for message in messages %}
          <p>{{ message }}</p>
        {% endfor %}
      </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Sign Up</button>
    </form>

    <p>Already have an account? <a href="{% url 'login' %}">Login</a></p>
  </div>
</body>
</html>
